<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anyShare - ERROR</title>
    <link rel="icon" type="image/svg+xml" href="/static/image/anyshare.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>anyShare</h1>
            <div class="header-buttons">
                <a href="/" class="nav-link">
                    <span aria-hidden="true" class="matsym">upload_file</span>
                    <span>Upload</span>
                </a>
                <a href="/login" class="nav-link">
                    <span aria-hidden="true" class="matsym">login</span>
                    <span>Login</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="upload-container">
            <div class="upload-box">
                <h2>
                    <span class="matsym bigger" aria-hidden="true" id="error-box-icon">warning</span>
                    <span>ERROR</span>
                </h2>

                <p>{{message}}</p>
            </div>
        </div>
    </main>
</body>

</html>
