<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anyShare - Enter Password</title>
    <link rel="icon" type="image/svg+xml" href="/static/image/anyshare.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>anyShare</h1>
            <div class="header-buttons">
                <a href="/" class="nav-link">
                    <span aria-hidden="true" class="matsym">upload_file</span>
                    <span>Upload</span>
                </a>
                <a href="/admin" class="nav-link">
                    <span aria-hidden="true" class="matsym">manage_accounts</span>
                    <span>Admin</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="upload-container">
            <div class="upload-box">
                <h2>
                    <span class="matsym" aria-hidden="true">lock</span>
                    <span>Enter Password</span>
                </h2>

                <p>This file is password protected, please enter a password to access it.</p>
                % if error:
                <div class="error-message">
                    <p>{{ error }}</p>
                </div>
                % end

                <form action="/verify" method="post" class="password-form">
                    <input type="hidden" name="hash" value="{{ file_hash }}">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="text" id="password" name="password" placeholder="Please enter a 6-digit password" required>
                    </div>
                    <button type="submit" class="btn btn-upload">Verify Password</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/static/js/main.js"></script>
</body>

</html>
