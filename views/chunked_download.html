<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anyShare - Chunked Download</title>
    <link rel="icon" type="image/svg+xml" href="/static/image/anyshare.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>anyShare</h1>
            <div class="header-buttons">
                <a href="/" class="nav-link">
                    <span aria-hidden="true" class="matsym">upload_file</span>
                    <span>Upload</span>
                </a>
                <a href="/login" class="nav-link">
                    <span aria-hidden="true" class="matsym">login</span>
                    <span>Login</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="upload-container">
            <div class="upload-box">
                <h2>
                    <span class="matsym" aria-hidden="true">download</span>
                    <span>Preparing Download</span>
                </h2>
                <p>Your file download will start shortly using chunked download technology...</p>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">Initializing...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/chunk-download.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL参数获取文件信息
            const urlParams = new URLSearchParams(window.location.search);
            const fileHash = urlParams.get('hash');
            const password = urlParams.get('pwd');
            
            if (!fileHash) {
                alert('Invalid download link');
                window.location.href = '/';
                return;
            }
            
            // 更新进度显示
            const progressBar = document.querySelector('.progress-fill');
            const progressText = document.querySelector('.progress-text');
            
            // 创建分片下载器
            const chunkDownloader = new ChunkDownloader({
                chunkSize: 1024 * 1024, // 1MB chunks
                maxConcurrent: 3,
                maxRetries: 3,
                retryDelay: 1000,
                onProgress: function(progress) {
                    const percent = Math.round(progress.progress);
                    progressBar.style.width = percent + '%';
                    progressText.textContent = `Downloading... ${percent}%`;
                },
                onSuccess: function(result) {
                    progressText.textContent = 'Download completed!';
                    // 创建下载链接并触发下载
                    chunkDownloader.createDownloadLink(result.blob, result.fileName);
                    
                    // 3秒后自动跳转回主页
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                },
                onError: function(error) {
                    console.error('Download error:', error);
                    progressText.textContent = 'Download failed: ' + error.message;
                }
            });
            
            // 开始分片下载
            chunkDownloader.downloadFile(fileHash, password);
        });
    </script>
</body>
</html>
